<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тарифы — Школа видеомонтажа и 3D-графики</title>
<style>
    /* ====== FONTS ====== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    /* ====== RESET & BASE ====== */
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #08090d;
        --card-border: rgba(255, 255, 255, 0.06);
        --accent-purple: #4d12e6;
        --accent-teal: #2ec4b6;
        --check-green: #2ecc71;
        --gold: #ffb703;
        --gold-border: rgba(255, 183, 3, 0.18);
        --text-main: #f5f6fa;
        --text-dim: rgba(235, 237, 245, 0.62);
        --text-dim-strong: rgba(235, 237, 245, 0.82);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    /* ====== BACKGROUND: GRID + GLOW SPHERES ====== */
    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 40px 40px;
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
        mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
    }

    .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(150px);
        opacity: 0.3;
        z-index: 0;
        pointer-events: none;
    }

    .glow--purple {
        width: 560px;
        height: 560px;
        background: var(--accent-purple);
        top: -180px;
        left: -160px;
    }

    .glow--teal {
        width: 520px;
        height: 520px;
        background: var(--accent-teal);
        bottom: -180px;
        right: -140px;
    }

    /* ====== PAGE LAYOUT ====== */
    .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 90px 24px 110px;
    }

    /* ====== TITLE ====== */
    .page__eyebrow {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 18px;
        padding: 8px 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.02);
    }

    .page__title {
        font-size: clamp(48px, 8vw, 82px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
        text-align: center;
        background: linear-gradient(180deg, #ffffff 0%, #a0a5b0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .page__subtitle {
        font-size: 16px;
        color: var(--text-dim);
        text-align: center;
        max-width: 560px;
        margin-bottom: 64px;
        line-height: 1.6;
    }

    /* ====== GRID: 2x2 on desktop, 1 column on mobile ====== */
    .pricing {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 460px));
        gap: 32px;
        justify-content: center;
        width: 100%;
        max-width: 980px;
    }

    /* ====== CARD (Glassmorphism) ====== */
    .card {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 44px 38px 40px;
        border-radius: 26px;
        background:
            linear-gradient(160deg,
                rgba(255, 255, 255, 0.06) 0%,
                rgba(255, 255, 255, 0.015) 45%,
                rgba(255, 255, 255, 0.005) 100%);
        border: 1px solid var(--card-border);
        -webkit-backdrop-filter: blur(22px);
        backdrop-filter: blur(22px);
        overflow: hidden;
        opacity: 0;
        transform: translateY(40px);
        animation: cardIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.35s ease,
                    box-shadow 0.35s ease;
    }

    .card:nth-child(1) { animation-delay: 0.10s; }
    .card:nth-child(2) { animation-delay: 0.20s; }
    .card:nth-child(3) { animation-delay: 0.30s; }
    .card:nth-child(4) { animation-delay: 0.40s; }

    @keyframes cardIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card:hover {
        transform: translateY(-12px);
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
            0 26px 64px -20px rgba(77, 18, 230, 0.38),
            0 8px 32px -12px rgba(0, 0, 0, 0.6);
    }

    .card--vip:hover {
        box-shadow:
            0 26px 64px -18px rgba(255, 183, 3, 0.32),
            0 8px 32px -12px rgba(0, 0, 0, 0.6);
    }

    .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(90deg,
            transparent,
            rgba(255, 255, 255, 0.32),
            transparent);
    }

    /* ====== VIP-КАРТА ====== */
    .card--vip {
        border-color: var(--gold-border);
        background:
            linear-gradient(160deg,
                rgba(255, 183, 3, 0.08) 0%,
                rgba(255, 255, 255, 0.025) 50%,
                rgba(255, 255, 255, 0.005) 100%),
            linear-gradient(160deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.015) 100%);
    }

    .card--vip::before {
        background: linear-gradient(90deg,
            transparent,
            rgba(255, 183, 3, 0.6),
            transparent);
    }

    .card--vip .card__title { color: var(--gold); }
    .card--vip .check { color: var(--gold); box-shadow: 0 0 16px rgba(255, 183, 3, 0.6); }
    .card--vip .card__btn {
        background: linear-gradient(135deg, #ffb703 0%, #ff9505 100%);
        color: #1a1206;
    }
    .card--vip .card__btn:hover {
        box-shadow: 0 12px 36px -8px rgba(255, 183, 3, 0.55);
    }

    /* ====== CONTENT CARD ====== */
    .card__head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
    }

    .card__title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .card__badge {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1a1206;
        background: linear-gradient(135deg, #ffd768, #ffb703);
        padding: 6px 12px;
        border-radius: 100px;
        margin-top: 2px;
    }

    .card__price {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 16px 0 28px;
    }

    .card__price-value {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(180deg, #ffffff, #a0a5b0);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .card--vip .card__price-value {
        background: linear-gradient(180deg, #ffe08a, #ffb703);
        -webkit-background-clip: text;
        background-clip: text;
    }

    .card__price-currency {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-dim-strong);
    }

    .card__divider {
        height: 1px;
        background: linear-gradient(90deg,
            transparent,
            rgba(255, 255, 255, 0.12),
            transparent);
        margin-bottom: 28px;
    }

    /* ====== FEATURES ====== */
    .card__features {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 18px;
        flex-grow: 1;
        margin-bottom: 34px;
    }

    .card__features li {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--text-dim);
        opacity: 0;
        transform: translateY(10px);
        animation: featureIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card:nth-child(1) .card__features li { animation-delay: 0.30s; }
    .card:nth-child(2) .card__features li { animation-delay: 0.40s; }
    .card:nth-child(3) .card__features li { animation-delay: 0.50s; }
    .card:nth-child(4) .card__features li { animation-delay: 0.60s; }

    @keyframes featureIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .check {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        margin-top: 2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(46, 204, 113, 0.14);
        border: 1px solid rgba(46, 204, 113, 0.4);
        color: var(--check-green);
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 0 16px rgba(46, 204, 113, 0.55);
        line-height: 1;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover .check {
        transform: scale(1.08);
        box-shadow: 0 0 22px rgba(46, 204, 113, 0.7);
    }

    .card--vip:hover .check {
        box-shadow: 0 0 24px rgba(255, 183, 3, 0.7);
    }

    /* ====== BUTTON ====== */
    .card__btn {
        display: block;
        width: 100%;
        padding: 16px 20px;
        border: none;
        border-radius: 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #6a2bf2 0%, #4d12e6 100%);
        box-shadow: 0 10px 28px -10px rgba(77, 18, 230, 0.6);
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .card__btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 14px 36px -10px rgba(77, 18, 230, 0.75);
    }

    .card__btn:active {
        transform: translateY(0);
    }

    .card__btn:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.3);
        outline-offset: 2px;
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 767px) {
        .page {
            padding: 64px 16px 80px;
        }
        .pricing {
            grid-template-columns: 1fr;
            gap: 24px;
        }
        .card {
            padding: 34px 28px 32px;
        }
        .card__price-value {
            font-size: 38px;
        }
        .card__title {
            font-size: 20px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .card, .card__features li {
            animation: none;
            opacity: 1;
            transform:
