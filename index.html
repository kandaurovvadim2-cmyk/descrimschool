<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифы обучения</title>
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* SaaS Глубокий темный фон с сеткой */
        body {
            background-color: #08090d;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1.page-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, #8a8d98 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Скрываем радио-кнопки, они нужны только для логики кликов */
        input[type="radio"] {
            display: none;
        }

        /* ЕДИНАЯ КОМПОЗИЦИЯ: Главный пульт */
        .saas-dashboard {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        /* Левая панель: Выбор тарифа */
        .dashboard-tabs {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Превращаем label в полноценную кликабельную ссылку-кнопку */
        .tab-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8a8d98;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            user-select: none;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.02);
        }

        .tab-arrow {
            font-size: 0.8rem;
            opacity: 0.5;
            transition: transform 0.3s ease;
        }

        /* Особый стиль для кнопки тарифа "Все включено" */
        .vip-tab {
            border: 1px solid rgba(255, 183, 3, 0.1);
        }

        /* ЛОГИКА НА ЧИСТОМ CSS: Подсветка активных вкладок при нажатии */
        #tab1:checked ~ .saas-dashboard .dashboard-tabs label[for="tab1"],
        #tab2:checked ~ .saas-dashboard .dashboard-tabs label[for="tab2"],
        #tab3:checked ~ .saas-dashboard .dashboard-tabs label[for="tab3"] {
            color: #ffffff;
            background: rgba(114, 18, 230, 0.15);
            border-color: rgba(114, 18, 230, 0.3);
        }
        #tab1:checked ~ .saas-dashboard .dashboard-tabs label[for="tab1"] .tab-arrow,
        #tab2:checked ~ .saas-dashboard .dashboard-tabs label[for="tab2"] .tab-arrow,
        #tab3:checked ~ .saas-dashboard .dashboard-tabs label[for="tab3"] .tab-arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Подсветка активного VIP-тарифа */
        #tab4:checked ~ .saas-dashboard .dashboard-tabs label[for="tab4"] {
            color: #ffb703;
            background: rgba(255, 183, 3, 0.1);
            border-color: rgba(255, 183, 3, 0.4);
        }
        #tab4:checked ~ .saas-dashboard .dashboard-tabs label[for="tab4"] .tab-arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Правая панель: Окно информации */
        .dashboard-content {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Скрываем все панели информации по умолчанию */
        .tariff-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* ЛОГИКА НА ЧИСТОМ CSS: Открытие нужных сведений при клике */
        #tab1:checked ~ .saas-dashboard .dashboard-content #panel-base-ae,
        #tab2:checked ~ .saas-dashboard .dashboard-content #panel-motion,
        #tab3:checked ~ .saas-dashboard .dashboard-content #panel-3d,
        #tab4:checked ~ .saas-dashboard .dashboard-content #panel-all-inclusive {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: #ffffff;
        }

        /* Списки фич */
        .features-list {
            list-style: none;
            margin-bottom: 40px;
            flex-grow: 1;
        }

        .features-list li {
            font-size: 0.95rem;
            color: #b0b3b8;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.45;
        }

        /* Зеленые галочки */
        .features-list li::before {
            content: "✓";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background-color: #2ec4b6;
            color: #08090d;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Стилизация VIP-панели */
        .vip-panel .features-list li::before {
            background-color: #ffb703;
        }
        .vip-panel .panel-title {
            color: #ffb703;
        }

        /* Цена и кнопки */
        .panel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-price {
            font-size: 1.8rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .btn-action {
            background: linear-gradient(90deg, #4d12e6 0%, #7212e6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(114, 18, 230, 0.25);
            text-align: center;
        }

        .btn-action:hover {
            box-shadow: 0 6px 20px rgba(114, 18, 230, 0.55);
            transform: translateY(-2px);
        }

        .vip-panel .btn-action {
            background: linear-gradient(90deg, #ff9f1c 0%, #ffb703 100%);
            color: #08090d;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.2);
        }
        .vip-panel .btn-action:hover {
            box-shadow: 0 6px 20px rgba(255, 183, 3, 0.5);
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            .saas-dashboard {
                flex-direction: column;
            }
            .dashboard-tabs {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .dashboard-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <h1 class="page-title">Тарифы</h1>

    <!-- Регистраторы кликов (Радио-переключатели) -->
    <input type="radio" id="tab1" name="tariff-select" checked>
    <input type="radio" id="tab2" name="tariff-select">
    <input type="radio" id="tab3" name="tariff-select">
    <input type="radio" id="tab4" name="tariff-select">

    <!-- Единая SaaS композиция -->
    <div class="saas-dashboard">
        
        <!-- Левое меню выбора (работает как ссылки через label) -->
        <div class="dashboard-tabs">
            <label for="tab1" class="tab-btn">
                База AE <span class="tab-arrow">→</span>
            </label>
            <label for="tab2" class="tab-btn">
                Моушен <span class="tab-arrow">→</span>
            </label>
            <label for="tab3" class="tab-btn">
                3Д Графика <span class="tab-arrow">→</span>
            </label>
            <label for="tab4" class="tab-btn vip-tab">
                Все включено <span class="tab-arrow">→</span>
            </label>
        </div>

        <!-- Правое окно вывода информации -->
        <div class="dashboard-content">

            <!-- Сведения 1: БАЗА АЕ -->
            <div id="panel-base-ae" class="tariff-panel">
