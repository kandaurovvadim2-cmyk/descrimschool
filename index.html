<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифы обучения</title>
    <style>
        /* Базовые настройки интерфейса */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Глубокий SaaS фон с сеткой и неоновым свечением */
        body {
            background-color: #08090d;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1.page-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, #8a8d98 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Скрытые радио-кнопки для управления логикой кликов без JS */
        input[type="radio"] {
            display: none;
        }

        /* Главная интерактивная SaaS-панель */
        .saas-dashboard {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Левая колонка: Навигация по тарифам */
        .dashboard-tabs {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Кнопка-ссылка (label) */
        .tab-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8a8d98;
            padding: 18px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-arrow {
            font-size: 0.85rem;
            opacity: 0.3;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .vip-tab {
            border: 1px solid rgba(255, 183, 3, 0.08);
        }

        /* Подсветка кнопок меню при активации */
        #tab1:checked ~ .saas-dashboard .dashboard-tabs label[for="tab1"],
        #tab2:checked ~ .saas-dashboard .dashboard-tabs label[for="tab2"],
        #tab3:checked ~ .saas-dashboard .dashboard-tabs label[for="tab3"] {
            color: #ffffff;
            background: rgba(114, 18, 230, 0.15);
            border-color: rgba(114, 18, 230, 0.3);
            box-shadow: 0 4px 12px rgba(114, 18, 230, 0.1);
        }

        #tab4:checked ~ .saas-dashboard .dashboard-tabs label[for="tab4"] {
            color: #ffb703;
            background: rgba(255, 183, 3, 0.08);
            border-color: rgba(255, 183, 3, 0.3);
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.05);
        }

        #tab1:checked ~ .saas-dashboard .dashboard-tabs label[for="tab1"] .tab-arrow,
        #tab2:checked ~ .saas-dashboard .dashboard-tabs label[for="tab2"] .tab-arrow,
        #tab3:checked ~ .saas-dashboard .dashboard-tabs label[for="tab3"] .tab-arrow,
        #tab4:checked ~ .saas-dashboard .dashboard-tabs label[for="tab4"] .tab-arrow {
            transform: translateX(5px);
            opacity: 1;
        }

        /* Правая колонка: Контентная зона */
        .dashboard-content {
            flex: 1.3;
            padding: 40px;
            position: relative;
            background: rgba(255, 255, 255, 0.002);
            min-height: 380px; /* Фиксирует высоту, чтобы интерфейс не прыгал */
        }

        /* Базовое скрытое состояние описания */
        .tariff-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            
            /* SaaS-эффект скрытия: прозрачность, сдвиг вниз, размытие и сжатие */
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.98);
            filter: blur(10px);
            transition: cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s; /* Плавный пружинящий эффект */
            pointer-events: none;
        }

        /* Красивое появление контента при выборе */
        #tab1:checked ~ .saas-dashboard .dashboard-content #panel-base-ae,
        #tab2:checked ~ .saas-dashboard .dashboard-content #panel-motion,
        #tab3:checked ~ .saas-dashboard .dashboard-content #panel-3d,
        #tab4:checked ~ .saas-dashboard .dashboard-content #panel-all-inclusive {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            filter: blur(0px);
            pointer-events: auto;
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        /* Списки фич с галочками */
        .features-list {
            list-style: none;
            margin-bottom: auto;
            padding-bottom: 20px;
        }

        .features-list li {
            font-size: 0.95rem;
            color: #b0b3b8;
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.45;
        }

        /* Иконки галочек с неоновым свечением */
        .features-list li::before {
            content: "✓";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background-color: #2ec4b6;
            color: #08090d;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 0 10px rgba(46, 196, 182, 0.3);
        }

        /* Стилизация VIP-панели (Все включено) */
        .vip-panel .features-list li::before {
            background-color: #ffb703;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }
        .vip-panel .panel-title {
            color: #ffb703;
        }

        /* Футер панели (Цена и Кнопка) */
        .panel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        .panel-price {
            font-size: 1.8rem;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: -0.02em;
        }

        /* SaaS кнопки с градиентом */
        .btn-action {
            background: linear-gradient(90deg, #4d12e6 0%, #7212e6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 15px rgba(114, 18, 230, 0.25);
            text-align: center;
        }

        .btn-action:hover {
            box-shadow: 0 6px 22px rgba(114, 18, 230, 0.5);
            transform: translateY(-2px);
        }

        .vip-panel .btn-action {
            background: linear-gradient(90deg, #ff9f1c 0%, #ffb703 100%);
            color: #08090d;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.2);
        }
        .vip-panel .btn-action:hover {
            box-shadow: 0 6px 22px rgba(255, 183, 3, 0.45);
        }

        /* Адаптивный стек под мобильные */
        @media (max-width: 768px) {
            .saas-dashboard {
                flex-direction: column;
            }
            .dashboard-tabs {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                padding: 16px;
            }
            .dashboard-content {
                padding: 30px 20px;
                min-height: 400px;
            }
            .tariff-panel {
                top: 30px;
                left: 20px;
                right: 20px;
                bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <h1 class="page-title">Тарифы</h1>

    <!-- Регистраторы кликов (Радио-переключатели) -->
    <input type="radio" id="tab1" name="tariff-select" checked>
    <input type="radio" id="tab2" name="tariff-select">
