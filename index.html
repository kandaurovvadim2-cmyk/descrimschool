<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тариф</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"></noscript>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #08090d;
        --card-border: rgba(255, 255, 255, 0.06);
        --accent-purple: #4d12e6;
        --accent-teal: #2ec4b6;
        --gold: #ffb703;
        --gold-border: rgba(255, 183, 3, 0.18);
        --text-main: #f5f6fa;
        --text-dim: rgba(235, 237, 245, 0.62);
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ====== ФОН ====== */
    .ripple-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-color: var(--bg);
        pointer-events: none;
    }

    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 40px 40px;
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
        mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
    }

    .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(150px);
        opacity: 0.3;
        z-index: 1;
        pointer-events: none;
    }
    .glow--purple { width: 560px; height: 560px; background: var(--accent-purple); top: -180px; left: -160px; }
    .glow--teal   { width: 520px; height: 520px; background: var(--accent-teal); bottom: -180px; right: -140px; }

    /* ====== СТРАНИЦА ====== */
    .page {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 110px;
    }

    .container {
        width: 100%;
        max-width: 720px;
        text-align: center;
        animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dim);
        text-decoration: none;
        padding: 10px 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.02);
        margin-bottom: 48px;
        transition: color 0.25s ease, border-color 0.25s ease;
    }
    .back-link:hover { color: var(--text-main); border-color: rgba(255, 255, 255, 0.2); }
    .back-link::before { content: "←"; font-size: 16px; }

    /* ====== ЗАГОЛОВОК ТАРИФА ====== */
    .tariff-title {
        font-size: clamp(44px, 7vw, 76px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-transform: uppercase;
        color: #eef0f4;
        background: linear-gradient(180deg, #ffffff 0%, #a0a5b0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 28px;
    }

    /* Золотая тема для VIP */
    .theme-gold .tariff-title {
        background: linear-gradient(180deg, #ffe08a 0%, #ffb703 100%);
        -webkit-background-clip: text;
        background-clip: text;
    }

    /* ====== ОПИСАНИЕ (ЗАГОТОВКА) ====== */
    .tariff-desc {
        font-size: 17px;
        color: var(--text-dim);
        line-height: 1.7;
        max-width: 600px;
        margin: 0 auto 48px;
    }

    /* ====== КНОПКА КУПИТЬ ====== */
    .buy-btn {
        display: inline-block;
        padding: 19px 56px;
        border-radius: 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #6a2bf2 0%, #4d12e6 100%);
        box-shadow: 0 10px 28px -10px rgba(77, 18, 230, 0.6);
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }
    .buy-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 14px 36px -10px rgba(77, 18, 230, 0.75);
    }
    .buy-btn:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.3);
        outline-offset: 3px;
    }

    .theme-gold .buy-btn {
        color: #1a1206;
        background: linear-gradient(135deg, #ffb703 0%, #ff9505 100%);
        box-shadow: 0 10px 28px -10px rgba(255, 183, 3, 0.55);
    }
    .theme-gold .buy-btn:hover {
        box-shadow: 0 14px 36px -8px rgba(255, 183, 3, 0.6);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(32px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 767px) {
        .page { padding: 32px 16px 80px; }
        .buy-btn { padding: 18px 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .container { animation: none; }
    }
</style>
</head>
<body>

    <div class="ripple-layer" id="ripple"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="glow glow--purple" aria-hidden="true"></div>
    <div class="glow glow--teal" aria-hidden="true"></div>

    <main class="page" id="page">
        <div class="container">

            <a class="back-link" href="index.html">Назад к тарифам</a>

            <h1 class="tariff-title" id="tariff-title">Название тарифа</h1>

            <!-- ЗАГОТОВКА: сюда потом вставим твоё описание -->
            <p class="tariff-desc" id="tariff-desc">
                Здесь будет описание тарифа.
            </p>

            <a class="buy-btn" id="buy-btn" href="#">Купить тариф</a>

        </div>
    </main>

    <script>
        // ============================================================
        // ЗАГОТОВКИ ТАРИФОВ — ПОТОМ ЗАМЕНИМ ТЕКСТ НА ТВОЙ
        // title   — название тарифа
        // desc    — описание (сейчас пустое)
        // link    — ссылка на оплату (сейчас "#", впишешь позже)
        // vip     — true = золотая тема оформления
        // ============================================================
        const TARIFFS = {
            "base-ae": { title: "База АЕ",        desc: "", link: "#", vip: false },
            "motion":  { title: "Моушен",         desc: "", link: "#", vip: false },
            "3d":      { title: "3Д Графика",     desc: "", link: "#", vip: false },
            "vip":     { title: "Все включено",   desc: "", link: "#", vip: true  }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id") || "base-ae";
        const t = TARIFFS[id] || TARIFFS["base-ae"];

        document.title = t.title;
        document.getElementById("tariff-title").textContent = t.title;
        document.getElementById("buy-btn").href = t.link;

        const descEl = document.getElementById("tariff-desc");
        if (t.desc && t.desc.trim() !== "") {
            descEl.textContent = t.desc;
        } else {
            descEl.textContent = "Здесь будет описание тарифа."; // заглушка до твоего текста
        }

        if (t.vip) {
            document.getElementById("page").classList.add("theme-gold");
        }

        // Рябь
        $(document).ready(function() {
            $("#ripple").ripples({
                resolution: 512,
                dropRadius: 20,
                perturbance: 0.04,
                interactive: true
            });
        });
    </script>
</body>
</html>
