<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифы обучения</title>
    <style>
        /* Базовые сбросы стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* SaaS Глубокий темный фон с сеткой */
        body {
            background-color: #08090d;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            color: #ffffff;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1.page-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, #8a8d98 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Скрываем стандартные радиокнопки */
        input[type="radio"] {
            display: none;
        }

        /* Единый контейнер для всех тарифов */
        .accordion-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Единая плашка тарифа */
        .accordion-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .accordion-item:hover {
            border-color: rgba(114, 18, 230, 0.35);
            box-shadow: 0 10px 30px rgba(114, 18, 230, 0.08);
        }

        /* Особый стиль для плашки "Все включено" */
        .accordion-item.vip-item {
            border-color: rgba(255, 183, 3, 0.15);
        }
        .accordion-item.vip-item:hover {
            border-color: rgba(255, 183, 3, 0.45);
            box-shadow: 0 10px 30px rgba(255, 183, 3, 0.08);
        }

        /* Кликабельный заголовок тарифа */
        .accordion-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        .accordion-trigger .arrow {
            font-size: 1.1rem;
            color: #8a8d98;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vip-item .accordion-trigger {
            color: #ffb703;
        }

        /* Контентная зона (по умолчанию скрыта через CSS Grid анимацию) */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .content-inner {
            overflow: hidden;
            padding: 0 30px;
            opacity: 0;
            filter: blur(8px);
            transform: translateY(-10px);
            transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease, padding 0.4s ease;
        }

        /* Списки характеристик внутри */
        .features-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .features-list li {
            font-size: 1rem;
            color: #b0b3b8;
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.45;
        }

        /* Круглые галочки со свечением */
        .features-list li::before {
            content: "✓";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background-color: #2ec4b6;
            color: #08090d;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 0 10px rgba(46, 196, 182, 0.3);
        }

        .vip-item .features-list li::before {
            background-color: #ffb703;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }

        /* Нижняя часть с ценой и кнопкой */
        .panel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-top: 20px;
            padding-bottom: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-price {
            font-size: 1.6rem;
            font-weight: 800;
            white-space: nowrap;
        }

        /* SaaS кнопки с градиентом */
        .btn-action {
            background: linear-gradient(90deg, #4d12e6 0%, #7212e6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(114, 18, 230, 0.25);
        }

        .btn-action:hover {
            box-shadow: 0 6px 22px rgba(114, 18, 230, 0.5);
            transform: translateY(-2px);
        }

        .vip-item .btn-action {
            background: linear-gradient(90deg, #ff9f1c 0%, #ffb703 100%);
            color: #08090d;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.2);
        }
        
        .vip-item .btn-action:hover {
            box-shadow: 0 6px 22px rgba(255, 183, 3, 0.45);
        }

        /* МАКЕТ НА ЧИСТОМ CSS: Логика раскрытия активного тарифа */
        #accordion-tab1:checked ~ .accordion-container .item-1 .accordion-content,
        #accordion-tab2:checked ~ .accordion-container .item-2 .accordion-content,
        #accordion-tab3:checked ~ .accordion-container .item-3 .accordion-content,
        #accordion-tab4:checked ~ .accordion-container .item-4 .accordion-content {
            grid-template-rows: 1fr;
        }

        #accordion-tab1:checked ~ .accordion-container .item-1 .content-inner,
        #accordion-tab2:checked ~ .accordion-container .item-2 .content-inner,
        #accordion-tab3:checked ~ .accordion-container .item-3 .content-inner,
        #accordion-tab4:checked ~ .accordion-container .item-4 .content-inner {
            opacity: 1;
            filter: blur(0px);
            transform: translateY(0);
        }

        /* Поворот стрелочки у активного тарифа */
        #accordion-tab1:checked ~ .accordion-container .item-1 .accordion-trigger .arrow,
        #accordion-tab2:checked ~ .accordion-container .item-2 .accordion-trigger .arrow,
        #accordion-tab3:checked ~ .accordion-container .item-3 .accordion-trigger .arrow,
        #accordion-tab4:checked ~ .accordion-container .item-4 .accordion-trigger .arrow {
            transform: rotate(90deg);
            color: #ffffff;
        }
        
        #accordion-tab4:checked ~ .accordion-container .item-4 .accordion-trigger .arrow {
            color: #ffb703;
        }
    </style>
</head>
<body>

    <h1 class="page-title">Тарифы</h1>

    <!-- Переключатели кликов -->
    <input type="radio" id="accordion-tab1" name="accordion-select" checked>
    <input type="radio" id="accordion-tab2" name="accordion-select">
    <input type="radio" id="accordion-tab3" name="accordion-select">
    <input type="radio" id="accordion-tab4" name="accordion-select">

    <!-- Главная SaaS композиция -->
    <main class="accordion-container">

        <!-- Тариф 1: БАЗА АЕ -->
        <div class="accordion-item item-1">
            <label for="accordion-tab1" class="accordion-trigger">
                <span>База AE</span>
                <span class="arrow">→</span>
            </label>
            <div class="accordion-content">
                <div class="content-inner">
                    <ul class="features-list">
                        <li>Обучение всем азам в AE</li>
                        <li>Проекты, которые не попали в мой пак</li>
                        <li>Сможете освоить базовые знания применения SFX\VFX</li>
                        <li>Готовые уроки, по которым вы будете обучаться</li>
                    </ul>
                    <div class="panel-footer">
                        <span class="panel-price">5 000 ₽</span>
                        <a href="#" class="btn-action">Подробнее</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Тариф 2: МОУШЕН -->
        <div class="accordion-item item-2">
            <label for="accordion-tab2" class="accordion-trigger">
                <span>Моушен</span>
                <span class="arrow">→</span>
            </label>
            <div class="accordion-content">
                <div class="content-inner">
                    <ul class="features-list">
                        <li>2 месяца обучения</li>
                        <li>Разборы моих личных проектов</li>
